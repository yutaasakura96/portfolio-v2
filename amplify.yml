version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Creating .env.production for SSR runtime env vars"
        - |
          cat > .env.production <<EOF
          # Generated by Amplify build (do not commit)

          # All variables below are set as regular Amplify Console environment variables.
          # Amplify Hosting Gen 1 Lambda runtime does not support Console Secrets injection.

          # Cognito Auth
          COGNITO_DOMAIN=${COGNITO_DOMAIN}
          COGNITO_REGION=${COGNITO_REGION}
          COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
          COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET}
          COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}

          # Database — DIRECT_URL only needed for prisma migrate deploy in build
          DATABASE_URL=${DATABASE_URL}
          DIRECT_URL=${DIRECT_URL}

          # AWS Core
          APP_AWS_REGION=${APP_AWS_REGION}
          APP_AWS_ACCESS_KEY_ID=${APP_AWS_ACCESS_KEY_ID}
          APP_AWS_SECRET_ACCESS_KEY=${APP_AWS_SECRET_ACCESS_KEY}

          # S3 & CloudFront
          S3_REGION=${S3_REGION}
          S3_BUCKET_NAME=${S3_BUCKET_NAME}
          CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}
          CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
          NEXT_PUBLIC_CLOUDFRONT_URL=${CLOUDFRONT_DOMAIN}

          # Email
          SES_FROM_EMAIL=${SES_FROM_EMAIL}
          CONTACT_EMAIL=${CONTACT_EMAIL}

          # Rate limiting (Upstash Redis)
          UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
          UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}

          # Sentry — SENTRY_AUTH_TOKEN is also read at runtime by the dashboard-external
          # route (admin dashboard Sentry card), so it must be in .env.production too,
          # not just available at build time for source-map uploads.
          NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          SENTRY_ORG_SLUG=${SENTRY_ORG_SLUG}
          SENTRY_PROJECT_SLUG=${SENTRY_PROJECT_SLUG}

          # Amplify dashboard (build status)
          AMPLIFY_APP_ID=${AMPLIFY_APP_ID}

          # Google Analytics (dashboard metrics — optional)
          GA_PROPERTY_ID=${GA_PROPERTY_ID}

          # Anthropic (certificate extraction — optional, feature degrades gracefully if unset)
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

          # Portfolio MCP server API key
          PORTFOLIO_API_KEY=${PORTFOLIO_API_KEY}
          EOF
        - npm ci
        - npx prisma generate
    build:
      commands:
        - npx prisma migrate deploy || echo "Migration skipped - database not reachable"
        - rm -rf docs/screenshots .agents mcp .codex .claude/docs .claude/hooks .claude/agents
        # sharp ships prebuilt libvips for BOTH glibc (linux-x64) and musl
        # (linuxmusl-x64) — ~19MB each. Amplify's Lambda is Amazon Linux, which is
        # glibc, so sharp resolves @img/sharp-linux-x64 and never loads the musl
        # build. It was still being traced into .next/standalone and shipped.
        # Must run BEFORE `npm run build`: the standalone bundle is produced by
        # next's file tracer during the build, copying from node_modules.
        # Verified on a linux/amd64 glibc container: sharp loads only
        # @img/sharp-linux-x64, and a full standalone build with musl removed
        # produces a working sharp (libvips 8.18.6) from inside the bundle.
        - rm -rf node_modules/@img/*musl*
        - npm run build
        # Fail the build rather than deploy an image pipeline that cannot start.
        # If the glibc binary is ever absent from the bundle, the previous
        # deployment stays live — far better than shipping a broken optimizer.
        # Single-quoted on purpose. Unquoted, the "ERROR: " inside contains a
        # colon-space, which YAML reads as a key separator in a plain scalar —
        # that made the whole buildspec unparseable and Amplify rejected the
        # build outright (job 100). Keep any command containing ": " quoted.
        - 'test -d .next/standalone/node_modules/@img/sharp-linux-x64 || { echo "ERROR - glibc sharp missing from standalone bundle"; exit 1; }'
        - find .next -name '*.js.map' -delete
        # Belt-and-braces: the cache tarball saved by earlier builds still holds a
        # ~50MB .next/cache from when the Turbopack build cache was enabled, and it
        # would otherwise be restored (and deployed) once more before the new,
        # cache-free tarball replaces it. Must run in `build`, not `postBuild` —
        # Amplify copies artifacts before postBuild executes.
        - rm -rf .next/cache
    postBuild:
      commands:
        - echo "Build output size (bytes):"
        - du -sb .next | cut -f1
        # Diagnostic breakdown. Amplify reports ~137MB here while CI reports ~81MB
        # on the same commit, and the cause is not yet known — it is NOT the
        # Turbopack cache (removing it recovered only ~1MB) and not prerender
        # volume (both generate 124/124 pages). These four views should identify
        # it. Safe to delete once the gap is understood.
        # Every line ends in `|| true`: a du/find/head pipeline can exit non-zero
        # (no match, SIGPIPE from head) and Amplify aborts the build on non-zero.
        # A diagnostic must never break the deploy.
        - echo "--- .next top level ---" || true
        - du -sh .next/* 2>/dev/null | sort -rh | head -15 || true
        - echo "--- .next/server ---" || true
        - du -sh .next/server/* 2>/dev/null | sort -rh | head -15 || true
        - echo "--- files over 5MB ---" || true
        - find .next -type f -size +5M -exec du -h {} + 2>/dev/null | sort -rh | head -20 || true
        - echo "--- .map files surviving the '*.js.map' delete, by extension ---" || true
        - find .next -type f -name '*.map' 2>/dev/null | sed 's/.*\.\([^.]*\.map\)$/\1/' | sort | uniq -c | sort -rn | head || true
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      # NOTE: .next/cache is deliberately NOT cached. `artifacts` above deploys
      # all of `.next` (baseDirectory + "**/*"), so anything restored into
      # .next/cache is also shipped to the SSR Lambda and counts against
      # Amplify's ~209MB limit. Next 16 enables the Turbopack build cache by
      # default (~280MB), which is why `turbopackFileSystemCacheForBuild` is off
      # in next.config.ts — caching this path would re-introduce the weight that
      # setting removes.
