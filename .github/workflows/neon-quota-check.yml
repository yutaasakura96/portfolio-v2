name: Neon Quota Check

# Early warning for the Neon free-tier compute cap (100 CU-hours per project per
# month). In August 2026 the project reached 110.15 CU-hours and was hard-blocked
# with HTTP 402, taking production down — the first signal was the live site
# returning 500s. This job turns that into a warning instead.
#
# `project.compute_time_seconds` is scoped to the current consumption period
# (`consumption_period_start` → `consumption_period_end`) and resets at the
# rollover, so it can be read directly.
#
# Caveat learned the hard way: at the Sep 2026 rollover the reset was ~27h late,
# and during that window the counter still showed August's total while the
# console already displayed 0/100. A stale-looking reading right after a period
# boundary may be lag, not real usage — cross-check the Neon console before
# acting on an alert fired in the first day of a period.
#
# Runs every Monday and Thursday so a mid-month ramp is caught with time to act.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1,4"

env:
  QUOTA_CU_HOURS: "100"
  WARN_RATIO: "0.7"

jobs:
  check:
    name: Check compute usage against the free-tier cap
    runs-on: ubuntu-latest

    steps:
      - name: Check Neon compute usage
        run: |
          set -euo pipefail

          response=$(curl -s -w "\n%{http_code}" \
            "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Neon API request failed (HTTP $http_code)"
            echo "$body"
            exit 1
          fi

          compute_seconds=$(echo "$body" | jq -r '.project.compute_time_seconds')
          active_seconds=$(echo "$body" | jq -r '.project.active_time_seconds')
          period_start=$(echo "$body" | jq -r '.project.consumption_period_start')
          period_end=$(echo "$body" | jq -r '.project.consumption_period_end')

          if [ "$compute_seconds" = "null" ] || [ -z "$compute_seconds" ]; then
            echo "::error::Could not read compute_time_seconds from the Neon API response"
            echo "$body" | jq .
            exit 1
          fi

          cu_hours=$(awk -v s="$compute_seconds" 'BEGIN { printf "%.2f", s / 3600 }')
          awake_hours=$(awk -v s="$active_seconds" 'BEGIN { printf "%.1f", s / 3600 }')
          threshold=$(awk -v q="$QUOTA_CU_HOURS" -v r="$WARN_RATIO" 'BEGIN { printf "%.2f", q * r }')
          percent=$(awk -v c="$cu_hours" -v q="$QUOTA_CU_HOURS" 'BEGIN { printf "%.1f", (c / q) * 100 }')

          {
            echo "### Neon compute usage this period"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Period | \`$period_start\` → \`$period_end\` |"
            echo "| Compute used | **$cu_hours** CU-hours |"
            echo "| Cap (free plan) | $QUOTA_CU_HOURS CU-hours |"
            echo "| Consumed | ${percent}% |"
            echo "| Compute awake | $awake_hours hours |"
            echo "| Warn threshold | $threshold CU-hours |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Neon compute usage: $cu_hours / $QUOTA_CU_HOURS CU-hours (${percent}%), awake ${awake_hours}h"

          if awk -v c="$cu_hours" -v q="$QUOTA_CU_HOURS" 'BEGIN { exit !(c >= q) }'; then
            echo "::error::Neon compute quota EXCEEDED: $cu_hours / $QUOTA_CU_HOURS CU-hours (${percent}%). The database is blocked (HTTP 402) and production will return 500s."
            exit 1
          fi

          if awk -v c="$cu_hours" -v t="$threshold" 'BEGIN { exit !(c >= t) }'; then
            echo "::error::Neon compute usage at ${percent}% of the free-tier cap ($cu_hours / $QUOTA_CU_HOURS CU-hours, awake ${awake_hours}h). Investigate what is keeping the compute awake before it hard-blocks."
            exit 1
          fi

          echo "Usage is within budget."
